---
name:  twomean
title: Two-Sample t
jrs:   '1.1'

items:

    - name: ghostplot
      type: Image
      width: 900
      height: 1
      renderFun: .ghostplot

    - name: nomality_plot
      title: Normality Assessment
      type: Image
      width: 900
      height: 600
      renderFun: .nomality_plot
      visible: (norma_assess_yn)

    - name:  warning_message
      type:  Html
      
    - name:  tablestyle_ttest_1
      type:  Html

    - name:  tablestyle_ttest_2
      type:  Html

      
    - name:  tablestyle_boot
      type:  Html
      clearWith:
          - variable
      visible: (boot_yn)
  
     
    - name: boot_plot_interval
      title: Bootstrap Intervals
      type: Image
      width: 500
      height: 300
      renderFun: .boot_plot_interval
      visible: (boot_yn && boot_intervalplot_yn) 
      
    - name: boot_plot_null
      title: Bootstrap Null Distribution
      type: Image
      width: 500
      height: 300
      renderFun: .boot_plot_null
      visible: (boot_yn && testyn_boot && boot_nullplot_yn)

