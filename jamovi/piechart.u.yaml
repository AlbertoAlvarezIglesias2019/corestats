title: Pie Chart
name: piechart
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Data Input Method
        children:
          - type: RadioButton
            name: mode_variables_btn
            optionName: input_mode
            optionPart: use_variables
            label: Variables from dataset
          - type: RadioButton
            name: mode_matrix_btn
            optionName: input_mode
            optionPart: use_matrix
            label: Summarised data in a table

# 2. Named LayoutBox wrapper for the variable selectors
  - type: VariableSupplier
    name: variables_panel
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Response
        children:
          - type: VariablesListBox
            name: y_axis
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Panel by
        children:
          - type: VariablesListBox
            name: panel_by
            maxItemCount: 1
            isTarget: true

  # 3. Custom Manual Table
  - type: CustomControl
    name: table_input_container


  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: General
        children:
          - type: LayoutBox
            style: inline
            children:
              - type: Label
                label: 'Legend position'
              - type: ComboBox
                name: legend_pos
          - type: CheckBox
            name: miss_yn
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: summ_type
      - type: CustomControl
        name: decimal_inputs

  - type: CollapseBox
    label: Appearance
    collapsed: true
    margin: large
    children:
      - type: LayoutBox
        style: inline
        children:
        - type: CustomControl
          name: size_inputs



  - type: CollapseBox
    label: Plot Labels & Text
    collapsed: true
    margin: large
    children:
      - type: CustomControl
        name: plotLabels



