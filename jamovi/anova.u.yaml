title: One-Way ANOVA
name: anova
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome
        children:
          - type: VariablesListBox
            name: variable
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping variable
        children:
          - type: VariablesListBox
            name: by
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: refl
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: plotdata_yn
      - type: Label
        label: Hypothesis Test
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: ev
              - type: CheckBox
                name: norma_assess_yn
      - type: CustomControl
        name: decimal_inputs

  - type: CollapseBox
    label: Options
    collapsed: true
    margin: large
    children:
      - type: Label
        label: Missing Values
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: miss_yn
                
      - type: Label
        label: Display
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CustomControl
                name: size_inputs
              - type: CustomControl
                name: plotLabels

  - type: CollapseBox
    label: Comparisons
    collapsed: true
    margin: large
    children:
      - type: CheckBox
        name: ph_yn
      - type: ComboBox
        name: method
        enable: (ph_yn)
      - type: Label
        label: Display
        children:
          - type: CheckBox
            name: ph_plot_intervals_yn
            enable: (ph_yn)
          - type: CheckBox
            name: ph_plot_significance_yn
            enable: (ph_yn)
