title: Tables
name: tables
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Rows
        children:
          - type: VariablesListBox
            name: row
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Columns
        children:
          - type: VariablesListBox
            name: col
            maxItemCount: 1
            isTarget: true
  - type: Label
    label: Summaries
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: perc
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: marg

  - type: CollapseBox
    label: Options
    collapsed: true
    margin: large
    children:
      - type: Label
        label: General
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: addp
              - type: CheckBox
                name: miss_yn
      - type: CustomControl
        name: decimal_inputs
    
      - type: Label
        label: Size
        children:
          - type: LayoutBox
            style: inline
            children:
              - type: CustomControl
                name: size_inputs

  - type: CollapseBox
    label: Labels and Titles
    collapsed: true
    margin: large
    children:
      - type: CustomControl
        name: plotLabels
