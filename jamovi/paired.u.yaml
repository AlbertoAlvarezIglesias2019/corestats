title: Paired t..
name: paired
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    suggested:
      - continuous
    permitted:
      - numeric
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variable 1
        children:
          - type: VariablesListBox
            name: var1
            isTarget: true
            maxItemCount: 1
  
      - type: TargetLayoutBox
        label: Variable 2
        children:
          - type: VariablesListBox
            name: var2
            isTarget: true
            maxItemCount: 1
                  

  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: plotdata_yn
  - type: Label
    label: Confidence Interval
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: conf_ttest
            format: number
  - type: Label
    label: Hypothesis Test
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: testyn_ttest
          - type: TextBox
            name: nh_ttest
            format: number
            enable: (testyn_ttest)
          - type: ComboBox
            name: alt_ttest
  - type: CollapseBox
    label: Options
    collapsed: true
    margin: large
    children:
      - type: Label
        label: General
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: miss_yn
      - type: CustomControl
        name: decimal_inputs
      - type: Label
        label: Size
        children:
          - type: LayoutBox
            style: inline
            children:
              - type: CustomControl
                name: size_inputs

  - type: CollapseBox
    label: Bootstrap
    collapsed: true
    margin: large
    children:
      - type: CheckBox
        name: boot_yn
      - type: Label
        label: Bootstrap Interval
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: conf_boot
                format: number
                enable: (boot_yn)
              - type: CheckBox
                name: boot_intervalplot_yn
                enable: (boot_yn)
      - type: Label
        label: Bootstrap Hypothesis Test
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: testyn_boot
                enable: (boot_yn)
              - type: ComboBox
                name: alt_boot
                enable: (testyn_boot && boot_yn)
              - type: CheckBox
                name: boot_nullplot_yn
                enable: (boot_yn && testyn_boot)
                
