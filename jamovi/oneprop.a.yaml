    - name: boot_nullplot_yn
      title: Plot bootstrap null distribution
      type: Bool
      default: false 
      
      
    - name: boot_intervalplot_yn
      title: Visualise bootstrap interval
      type: Bool
      default: false
      
    - name: miss_text
      title: Missing Values Label
      type: String
      hidden: true
