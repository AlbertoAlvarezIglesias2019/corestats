title: Two proportions
name: twoprop
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Data Input Method
        children:
          - type: LayoutBox
            style: inline
            children:
              - type: RadioButton
                name: mode_variables_btn
                optionName: input_mode
                optionPart: use_variables
                label: Variables from dataset
              - type: RadioButton
                name: mode_matrix_btn
                optionName: input_mode
                optionPart: use_matrix
                label: Summarised data in a table

  - type: VariableSupplier
    name: variables_panel
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome
        children:
          - type: VariablesListBox
            name: variable
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: refl
      - type: TargetLayoutBox
        label: Grouping variable
        children:
          - type: VariablesListBox
            name: by
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: grol
            
  - type: CustomControl
    name: summary_p_2g_input_container


  # Confidence Interval (Stacked vertically, control inline)
  - type: Label
    label: Confidence Interval
    children:
      - type: LayoutBox
        margin: large
        style: inline
        children:
          - type: TextBox
            name: conf_normal
            format: number
          - type: ComboBox
            name: meth
  - type: CustomControl
    name: decimal_inputs

  # Hypothesis Test (Stacked vertically, controls wrapped cleanly)
  - type: Label
    label: Hypothesis Test
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: testyn_normal
          - type: CheckBox
            name: yatc
            enable: (testyn_normal)
          - type: LayoutBox
            style: inline
            children:
              - type: TextBox
                name: nh_normal
                format: number
                enable: (testyn_normal)
              - type: ComboBox
                name: alt_normal
                enable: (testyn_normal)

  - type: Label
    label: Bootstrap
    children:
      - type: CheckBox
        name: boot_yn
      - type: LayoutBox
        margin: large
        style: inline
        children:
          - type: CheckBox
            name: boot_intervalplot_yn
            enable: (boot_yn)
          - type: CheckBox
            name: boot_nullplot_yn
            enable: (boot_yn && testyn_normal)

  - type: CollapseBox
    label: Options
    collapsed: true
    margin: large
    children:
      - type: Label
        label: Missing Values
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: miss_yn
                
      - type: Label
        label: Display
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CustomControl
                name: size_inputs
              - type: CustomControl
                name: plotLabels

